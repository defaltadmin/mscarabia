<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glass card -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Logo -->
  <rect x="140" y="140" width="64" height="64" rx="16" fill="url(#accent)"/>
  <text x="172" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#fff">M</text>
  <text x="224" y="175" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#fff" letter-spacing="-0.5">MSC Arabia</text>
  <text x="224" y="205" font-family="system-ui, sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.5)" letter-spacing="2">IT SERVICES · FIRE SAFETY · MANPOWER</text>
  <!-- Tagline -->
  <text x="140" y="310" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#fff" letter-spacing="-1">Saudi-Based. Globally Certified.</text>
  <text x="140" y="355" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">Riyadh's leading provider of Managed IT Services, Fire Safety Engineering, and Manpower Solutions.</text>
  <!-- Highlights -->
  <rect x="140" y="400" width="200" height="60" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="240" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#E63946">IT</text>
  <text x="240" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.5)">Managed Services</text>
  <rect x="360" y="400" width="200" height="60" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="460" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#E63946">Fire</text>
  <text x="460" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.5)">Safety Engineering</text>
  <rect x="580" y="400" width="200" height="60" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="680" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#E63946">Staff</text>
  <text x="680" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="rgba(255,255,255,0.5)">Manpower Supply</text>
  <!-- Bottom bar -->
  <rect x="80" y="570" width="1040" height="60" rx="0" fill="rgba(255,255,255,0.03)"/>
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="rgba(255,255,255,0.3)">mscarabia.com</text>
